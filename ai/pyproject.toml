[project]
name = "legallens-ai"
version = "0.1.0"
description = "Legal Lens AI layer: the orchestrator's intent router (Claude Haiku 4.5 via LangChain)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "fastembed>=0.9.0",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.8",
    "onnxruntime>=1.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
    "rapidocr>=3.10.0",
]

[project.scripts]
legallens-ai = "legallens_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# OneDrive folders can't hold hardlinks, so uv copies packages into .venv instead.
link-mode = "copy"

[dependency-groups]
bench = [
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.6",
]
dev = [
    "fpdf2>=2.8.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
qwen = [
    "torch>=2.6",
    "transformers>=4.51",
]

# ---------------------------------------------------------------- quality

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "C4"]
ignore = [
    "S101", # assert is fine in tests
]
# Legal text uses curly apostrophes (Tenant’s); patterns must match them on purpose.
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["pypdfium2", "pypdfium2.*", "pytesseract"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests call the real Anthropic API (cost, network): run them with `pytest -m live`.
markers = [
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)",
    "ocr: runs the real OCR model (local, a few seconds; deselect with -m 'not ocr')",
]
addopts = "-ra --strict-markers -m 'not live'"
