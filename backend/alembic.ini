# Alembic CLI config. The app itself runs migrations on startup; use the CLI only to
# create new revisions:  uv run alembic revision --autogenerate -m "describe change"
# The database path comes from LL_DATA_DIR (see src/legallens/db/migrations/env.py).

[alembic]
script_location = %(here)s/src/legallens/db/migrations
prepend_sys_path = src
path_separator = os
