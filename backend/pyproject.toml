[project]
name = "legallens"
version = "0.1.0"
description = "Legal Lens backend: FastAPI service for documents, conversations and the streamed chat API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# The AI layer (ai/): OCR, chunking, embeddings, vector index. `uv sync --extra ai`, then set
# LL_INGESTION=legallens.adapters.ai_ingestion:create.
ai = ["legallens-ai"]

[project.scripts]
legallens-api = "legallens.main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# OneDrive folders can't hold hardlinks, so uv copies packages into .venv instead.
link-mode = "copy"

[tool.uv.sources]
legallens-ai = { path = "../ai", editable = true }

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# ---------------------------------------------------------------- quality

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/legallens/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "C4"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fpdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["legallens.db.migrations.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests call the real Anthropic API (cost, network, model downloads): `pytest -m live`.
markers = ["live: calls the real Anthropic API and loads the search models"]
addopts = "-ra --strict-markers -m 'not live'"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["legallens"]
branch = true
# SQLAlchemy's async layer switches greenlets; without this, code after DB awaits looks unrun.
concurrency = ["greenlet", "thread"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
