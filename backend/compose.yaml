# Backend only for now; the frontend service is added when the two are integrated.
#   docker compose up --build
services:
  backend:
    build: .
    image: legallens-backend:local
    ports:
      - "127.0.0.1:8000:8000" # loopback only: never reachable from the network (NFR-5)
    volumes:
      - legallens-data:/data # documents + SQLite survive container rebuilds
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  legallens-data:
