# Serves the built app and proxies /api to the backend container (same origin, so no CORS).

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Docker's DNS, re-resolved: nginx starts even if the backend is down (the UI then shows
    # "service not reachable" on the 502) and follows the backend across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Chat answers stream as Server-Sent Events: pass every token through immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s; # backend's whole-reply limit is 300 s
        proxy_send_timeout 360s;

        # Uploads: 25 MB limit + multipart overhead; the backend enforces the real limit.
        client_max_body_size 26m;
        proxy_request_buffering off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/c/:id) fall back to the app shell, which is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
