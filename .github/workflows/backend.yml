name: backend

on:
  push:
    paths:
      - "backend/**"
      - "frontend/src/api/types.ts" # the contract tests read it
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/api/types.ts"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: lint · types · tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=85

  docker:
    name: docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t legallens-backend .
      - run: docker run -d --name legallens -p 127.0.0.1:8000:8000 legallens-backend
      - name: wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs legallens
          exit 1
